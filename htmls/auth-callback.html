<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="icon" href="/favicon.ico" type="image/x-icon"><title>Signing in...</title></head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f8f9ff;font-family:sans-serif;color:#002046;">
<p>Signing in...</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  (async function() {
    const supabase = window.supabase.createClient(
      'https://nstyqceyjkgevnibfqks.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zdHlxY2V5amtnZXZuaWJmcWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NDMwMzcsImV4cCI6MjA5ODIxOTAzN30.EUozeDCEFqvkLSNOpaBEaXA2D8ZbdPrhGdrNFelpRCU'
    );

    try {
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error || !session) {
        window.location.href = '/login';
        return;
      }

      // Strictly verify session against the backend database
      const res = await fetch('/api/verify-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: session.access_token })
      });
      const result = await res.json();

      if (!result.valid) {
        sessionStorage.removeItem('auth_cache');
        try { await supabase.auth.signOut(); } catch(e) {}
        const target = result.reason === 'single_session' ? '/pending?reason=single_session&email=' + encodeURIComponent(result.email || '')
          : result.reason === 'ip_limit' ? '/pending?reason=ip_limit&email=' + encodeURIComponent(result.email || '')
          : result.reason === 'unauthorized' ? '/pending?reason=unauthorized&email=' + encodeURIComponent(result.email || '')
          : '/pending';
        window.location.href = target;
        return;
      }

      sessionStorage.setItem('auth_cache', JSON.stringify({ user: result.user, token: session.access_token }));

      // If opened as popup, notify opener
      if (window.opener) {
        window.opener.postMessage({ type: 'supabase-auth', session }, window.origin);
        window.close();
        return;
      }

      // Main window direct redirect
      window.location.href = result.user.role === 'admin' ? '/admin' : '/analytics';
    } catch (e) {
      console.error('Auth callback error:', e);
      window.location.href = '/login';
    }
  })();
</script>
</body>
</html>
