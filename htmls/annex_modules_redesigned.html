/* ── Page layout ── */

/* ── Card ── */

.card-header-icon {

/* ── Grids ── */
.panel-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }

/* ── Fields ── */

/* ── Tooltips ── */

.tip-icon { cursor:help; color:#1261a3; font-size:14px; }

.counter-pill {

  padding:16px 12px;

  position:relative;
  overflow:hidden;

.counter-pill::before {

  position:absolute;

  height:3px;
  background:linear-gradient(90deg, #1261a3, #aec7f7);
  border-radius:14px 14px 0 0;

/* ── Animations ── */
@keyframes slideInUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

/* ── Responsive ── */
@media (max-width:900px) { .panel-grid, .counter-row { grid-template-columns:1fr; } }

                <input className={`field-input ${validationErrors.schoolId ? 'field-error' : ''}`} value={schoolMetadata.schoolId} onChange={e => setSchoolMetadata(p => ({ ...p, schoolId: e.target.value }))} placeholder="e.g., SCH-10293" />
                {validationErrors.schoolId && <div className="error-text">{validationErrors.schoolId}</div>}
              </div>
              <div>
                <label className="field-label">Reporting Year <span className="required">*</span></label>
                <input className={`field-input ${validationErrors.reportingYear ? 'field-error' : ''}`} value={schoolMetadata.reportingYear} onChange={e => setSchoolMetadata(p => ({ ...p, reportingYear: e.target.value }))} placeholder="e.g., 2023-2024" />
                {validationErrors.reportingYear && <div className="error-text">{validationErrors.reportingYear}</div>}
              </div>
              <div>
                <label className="field-label">Address <span className="required">*</span></label>
                <input className={`field-input ${validationErrors.address ? 'field-error' : ''}`} value={schoolMetadata.address} onChange={e => setSchoolMetadata(p => ({ ...p, address: e.target.value }))} placeholder="Full street address" />
                {validationErrors.address && <div className="error-text">{validationErrors.address}</div>}
              </div>
              <div>
                <label className="field-label">Classification <span className="required">*</span></label>
                <div className="radio-group">
                  {['Public', 'Private'].map(opt => (
                    <label key={opt} className="radio-option">
                      <input type="radio" name="e-classification" value={opt} checked={schoolMetadata.classification === opt} onChange={e => setSchoolMetadata(p => ({ ...p, classification: e.target.value }))} />
                      <span>{opt}</span>
                    </label>
                  ))}
                </div>
              </div>
              <div>
                <label className="field-label">Level <span className="required">*</span></label>
                <div className="radio-group">
                  {['Kindergarten', 'Elementary', 'Secondary'].map(opt => (
                    <label key={opt} className="radio-option">
                      <input type="radio" name="e-level" value={opt} checked={schoolMetadata.level === opt} onChange={e => setSchoolMetadata(p => ({ ...p, level: e.target.value }))} />
                      <span style={{ fontSize: '12px' }}>{opt}</span>
                    </label>
                  ))}
                </div>
              </div>
            </div>
          </div>

          <div className="bg-surface-container-lowest border border-outline-variant p-lg mb-lg">
            <div className="card-header mb-md">
              <div className="card-header-icon"><span className="material-symbols-outlined">fact_check</span></div>
              <div className="card-header-text">
                <div className="card-header-title">Concern Categories</div>
                <div className="card-header-subtitle">OFFENSE & VIOLATION DETAILS</div>
              </div>
            </div>
            <div className="category-pills">
              {moduleECategories.map(cat => (
                <button key={cat.id} className={`category-btn ${activeECategory === cat.id ? 'active' : ''}`} onClick={() => setActiveECategory(cat.id)}>
                  {cat.id}
                </button>
              ))}
            </div>
            <div style={{ fontSize: '12px', color: '#44474e', marginTop: '8px' }}>{moduleECategories.find(c => c.id === activeECategory)?.label}</div>
          </div>

          <div className="bg-surface-container-lowest border border-outline-variant p-lg mb-lg">
            <div className="card-header mb-md">
              <div className="card-header-icon"><span className="material-symbols-outlined">event_note</span></div>
              <div className="card-header-text">
                <div className="card-header-title">Incident Details — <strong>{activeECategory}</strong></div>
                <div className="card-header-subtitle">LOCATION & TIMELINE DETAILS</div>
              </div>
            </div>
            <div className="panel-grid">
              <div>
                <label className="field-label">Date of Incident <span className="required">*</span></label>
                <input type="date" className={`field-input ${validationErrors['e' + activeECategory + 'Date'] ? 'field-error' : ''}`} value={currentEData.incidentDate} onChange={e => updateEField('incidentDate', e.target.value)} />
                {validationErrors['e' + activeECategory + 'Date'] && <div className="error-text">{validationErrors['e' + activeECategory + 'Date']}</div>}
              </div>
              <div>
                <label className="field-label">Place of Incident <span className="required">*</span></label>
                <input className={`field-input ${validationErrors['e' + activeECategory + 'Place'] ? 'field-error' : ''}`} value={currentEData.incidentPlace} onChange={e => updateEField('incidentPlace', e.target.value)} placeholder="e.g., Off-Campus, Online Platform" />
                {validationErrors['e' + activeECategory + 'Place'] && <div className="error-text">{validationErrors['e' + activeECategory + 'Place']}</div>}
              </div>
            </div>

            <div style={{ marginTop: '16px' }}>
              <label className="field-label">Specific Concern Classification</label>
              <div className="chip-list">
                {eConcernOptions.map(c => (
                  <label key={c.id} className="checkbox-chip">
                    <input type="checkbox" checked={currentEData.concerns.includes(c.id)} onChange={() => toggleEConcern(c.id)} />
                    <span>{c.label}</span>
                  </label>
                ))}
              </div>
            </div>
          </div>

          <div className="bg-surface-container-lowest border border-outline-variant p-lg mb-lg">
            <div className="card-header mb-md">
              <div className="card-header-icon"><span className="material-symbols-outlined">person</span></div>
              <div className="card-header-text">
                <div className="card-header-title">Affected Student / Victim Details</div>
                <div className="card-header-subtitle">SUB-SECTION DETAILS</div>
              </div>
            </div>
            {currentEData.victims.map((vic, idx) => (
              <div key={idx} className="row-card">
                {currentEData.victims.length > 1 && <button className="remove-btn" type="button" onClick={() => removeEVictim(idx)} title="Remove">✕</button>}
                <div className="panel-grid">
                  <div>
                    <label className="field-label">Name <span className="required">*</span></label>
                    <input className={`field-input ${validationErrors['e' + activeECategory + 'Vic' + idx + 'Name'] ? 'field-error' : ''}`} value={vic.name} onChange={e => updateEVictim(idx, 'name', e.target.value)} placeholder="Last, First, M.I." />
                    {validationErrors['e' + activeECategory + 'Vic' + idx + 'Name'] && <div className="error-text">{validationErrors['e' + activeECategory + 'Vic' + idx + 'Name']}</div>}
                  </div>
                  <div>
                    <label className="field-label">Age <span className="required">*</span></label>
                    <input type="number" className={`field-input ${validationErrors['e' + activeECategory + 'Vic' + idx + 'Age'] ? 'field-error' : ''}`} value={vic.age} onChange={e => updateEVictim(idx, 'age', e.target.value)} placeholder="e.g., 13" />
                    {validationErrors['e' + activeECategory + 'Vic' + idx + 'Age'] && <div className="error-text">{validationErrors['e' + activeECategory + 'Vic' + idx + 'Age']}</div>}
                  </div>
                  <div>
                    <label className="field-label">Gender</label>
                    <div className="radio-group">
                      {['M', 'F', 'LGBTQIA+'].map(g => (
                        <label key={g} className="radio-option">
                          <input type="radio" name={'e-vic-gender-' + idx} value={g} checked={vic.gender === g} onChange={e => updateEVictim(idx, 'gender', e.target.value)} />
                          <span>{g}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label className="field-label">Learner with Disability</label>
                    <div className="chip-list" style={{ marginTop: '4px' }}>
                      {['Yes', 'No'].map(opt => (
                        <label key={opt} className={`radio-option ${vic.disability === opt ? 'active' : ''}`} style={{ padding: '6px 12px', cursor: 'pointer' }}>
                          <input type="radio" name={'e-vic-disability-' + idx} value={opt} checked={vic.disability === opt} onChange={e => updateEVictim(idx, 'disability', e.target.value)} />
                          <span>{opt}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            ))}
            <button className="add-btn" type="button" onClick={addEVictim}>
              <span style={{ fontSize: '16px' }}>+</span> Add Row
            </button>
          </div>

          <div className="bg-surface-container-lowest border border-outline-variant p-lg mb-lg">
            <div className="card-header mb-md">
              <div className="card-header-icon"><span className="material-symbols-outlined">groups</span></div>
              <div className="card-header-text">
                <div className="card-header-title">Subject / Respondent Details</div>
                <div className="card-header-subtitle">SUB-SECTION DETAILS</div>
              </div>
            </div>
            {currentEData.respondents.map((resp, idx) => (
              <div key={idx} className="row-card">
                {currentEData.respondents.length > 1 && <button className="remove-btn" type="button" onClick={() => removeERespondent(idx)} title="Remove">✕</button>}
                <div className="panel-grid">
                  <div>
                    <label className="field-label">Name <span className="required">*</span></label>
                    <input className={`field-input ${validationErrors['e' + activeECategory + 'Resp' + idx + 'Name'] ? 'field-error' : ''}`} value={resp.name} onChange={e => updateERespondent(idx, 'name', e.target.value)} placeholder="Last, First, M.I." />
                    {validationErrors['e' + activeECategory + 'Resp' + idx + 'Name'] && <div className="error-text">{validationErrors['e' + activeECategory + 'Resp' + idx + 'Name']}</div>}
                  </div>
                  <div>
                    <label className="field-label">Designation / Relationship</label>
                    <select className="field-select" value={resp.designation} onChange={e => updateERespondent(idx, 'designation', e.target.value)}>
                      <option value="">Select</option>
                      {affiliationOptions.map(a => <option key={a} value={a}>{a}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="field-label">Age</label>
                    <input type="number" className="field-input" value={resp.age} onChange={e => updateERespondent(idx, 'age', e.target.value)} placeholder="e.g., 28" />
                  </div>
                  <div>
                    <label className="field-label">Gender</label>
                    <div className="radio-group">
                      {['M', 'F', 'LGBTQIA+'].map(g => (
                        <label key={g} className="radio-option">
                          <input type="radio" name={'e-resp-gender-' + idx} value={g} checked={resp.gender === g} onChange={e => updateERespondent(idx, 'gender', e.target.value)} />
                          <span>{g}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            ))}
            <button className="add-btn" type="button" onClick={addERespondent}>
              <span style={{ fontSize: '16px' }}>+</span> Add Row
            </button>
          </div>

          <div className="bg-surface-container-lowest border border-outline-variant p-lg mb-lg">
            <div className="card-header mb-md">
              <div className="card-header-icon"><span className="material-symbols-outlined">folder</span></div>
              <div className="card-header-text">
                <div className="card-header-title">Actions Taken & Case Status</div>
                <div className="card-header-subtitle">SUB-SECTION DETAILS</div>
              </div>
            </div>
            <div className="panel-grid-1">
              <div>
                <label className="field-label">Actions Taken <span className="required">*</span></label>
                <textarea className={`field-textarea ${validationErrors['e' + activeECategory + 'Act'] ? 'field-error' : ''}`} value={currentEData.actionsTaken} onChange={e => updateEField('actionsTaken', e.target.value)} placeholder="Describe protection measures or agency referrals..." />
                {validationErrors['e' + activeECategory + 'Act'] && <div className="error-text">{validationErrors['e' + activeECategory + 'Act']}</div>}
              </div>
              <div>
                <label className="field-label">Status <span className="required">*</span></label>
                <select className="field-select" value={currentEData.status} onChange={e => updateEField('status', e.target.value)}>
                  {eStatusOptions.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                </select>
              </div>
            </div>
          </div>
        </>
      )}

      <div className="bg-surface-container-lowest border border-outline-variant p-lg mb-lg">
        <div className="card-header mb-md">
          <div className="card-header-icon"><span className="material-symbols-outlined">analytics</span></div>
          <div className="card-header-text">
            <div className="card-header-title">Summary Counters</div>
            <div className="card-header-subtitle">METRICS & CONSOLIDATED COUNTERS</div>
          </div>
        </div>
        <div className="counter-row">
          <div className="counter-pill resolved">
            <div className="counter-icon"><span className="material-symbols-outlined">check_circle</span></div>
            <div className="counter-num">{counters.resolved}</div>
            <div className="counter-label">Resolved</div>
          </div>
          <div className="counter-pill ongoing">
            <div className="counter-icon"><span className="material-symbols-outlined">pending_actions</span></div>
            <div className="counter-num">{counters.ongoing}</div>
            <div className="counter-label">Ongoing</div>
          </div>
          <div className="counter-pill external">
            <div className="counter-icon"><span className="material-symbols-outlined">account_balance</span></div>
            <div className="counter-num">{counters.external}</div>
            <div className="counter-label">Gov Agency</div>
          </div>
          <div className="counter-pill ngo">
            <div className="counter-icon"><span className="material-symbols-outlined">corporate_fare</span></div>
            <div className="counter-num">{counters.ngo}</div>
            <div className="counter-label">NGO</div>
          </div>
        </div>
      </div>

      <div className="bg-surface-container-lowest border border-outline-variant p-lg mb-lg">
        <div className="card-header mb-md">
          <div className="card-header-icon"><span className="material-symbols-outlined">draw</span></div>
          <div className="card-header-text">
            <div className="card-header-title">Signatures & Approvals</div>
            <div className="card-header-subtitle">VERIFICATION & SIGN-OFF</div>
          </div>
        </div>
        <div className="panel-grid">
          <div className="row-card">
            <div className="sig-header">
              <span className="material-symbols-outlined">edit_note</span> Prepared By
            </div>
            <div className="panel-grid-1">
              <div>
                <label className="field-label">Name <span className="required">*</span></label>
                <input className={`field-input ${validationErrors.preparedName ? 'field-error' : ''}`} value={preparedBy.name} onChange={e => setPreparedBy(p => ({ ...p, name: e.target.value }))} placeholder="Full Name" />
              </div>
              <div>
                <label className="field-label">Designation</label>
                <input className="field-input" value={preparedBy.designation} onChange={e => setPreparedBy(p => ({ ...p, designation: e.target.value }))} placeholder="e.g., Guidance Counselor" />
              </div>
              <div>
                <label className="field-label">Date <span className="required">*</span></label>
                <input type="date" className={`field-input ${validationErrors.preparedDate ? 'field-error' : ''}`} value={preparedBy.date} onChange={e => setPreparedBy(p => ({ ...p, date: e.target.value }))} />
              </div>
            </div>
          </div>
          <div className="row-card">
            <div className="sig-header">
              <span className="material-symbols-outlined">verified</span> Validated By
            </div>
            <div className="panel-grid-1">
              <div>
                <label className="field-label">Name <span className="required">*</span></label>
                <input className={`field-input ${validationErrors.validatedName ? 'field-error' : ''}`} value={validatedBy.name} onChange={e => setValidatedBy(p => ({ ...p, name: e.target.value }))} placeholder="Full Name" />
              </div>
              <div>
                <label className="field-label">Designation</label>
                <input className="field-input" value={validatedBy.designation} onChange={e => setValidatedBy(p => ({ ...p, designation: e.target.value }))} placeholder="e.g., School Principal" />
              </div>
              <div>
                <label className="field-label">Date <span className="required">*</span></label>
                <input type="date" className={`field-input ${validationErrors.validatedDate ? 'field-error' : ''}`} value={validatedBy.date} onChange={e => setValidatedBy(p => ({ ...p, date: e.target.value }))} />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div className="sticky-footer">
        <button className="secondary-btn" type="button" onClick={() => window.location.href = '/dashboard'}>
          <span className="material-symbols-outlined">save</span> Save Draft
        </button>
        <button className="primary-btn" type="button" onClick={handleSubmit}>
          <span className="material-symbols-outlined">send</span> Submit Report
        </button>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<ModuleAReportingPanel />);

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
