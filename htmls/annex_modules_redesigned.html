<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Annex A — Student Compliance Reporting</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<style>
/* ── Material Symbols ── */
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
.msf { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }

/* ── Base ── */
body { margin:0; font-family:'Inter',sans-serif; background:#f8f9ff; color:#121c28; }
button,input,select,textarea { font:inherit; }

/* ── Page layout ── */
.page { max-width:1280px; margin:0 auto; padding:24px 18px 120px; }

/* ── Card ── */
.card {
  background: #ffffff;
  border: 1px solid #9ca3af;
  border-radius: 16px;
  padding: 0;
  box-shadow: 0 2px 8px rgba(0,32,70,.05);
  margin-bottom: 40px;
  overflow: hidden;
}

/* ── Card header (new Material-style header pattern) ── */
.card-header {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 20px;
  border-bottom:1px solid #eef4ff;
  background:#f8f9ff;
}
.card-header-icon {
  width:36px; height:36px;
  border-radius:10px;
  background:#d2e4ff;
  color:#002046;
  display:grid;
  place-items:center;
  flex-shrink:0;
}
.card-header-icon .material-symbols-outlined { font-size:20px; }
.card-header-text { flex:1; }
.card-header-title {
  font-family:'Atkinson Hyperlegible Next',sans-serif;
  font-size:15px; font-weight:800; color:#002046;
  line-height:1.3;
}
.card-header-subtitle {
  font-size:11px; color:#74777f;
  text-transform:uppercase; letter-spacing:.07em; font-weight:700;
  margin-top:1px;
}
.card-body { padding:20px; }

/* Legacy section titles (kept for compatibility) */
.section-title { font-family:'Atkinson Hyperlegible Next',sans-serif; font-size:18px; font-weight:800; color:#002046; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.section-title-sm { font-family:'Atkinson Hyperlegible Next',sans-serif; font-size:16px; font-weight:800; color:#002046; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

/* ── Grids ── */
.panel-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.panel-grid-1 { display:grid; grid-template-columns:1fr; gap:12px; }

/* ── Fields ── */
.field-label { display:flex; align-items:center; gap:4px; margin-bottom:6px; font-size:12px; color:#44474e; text-transform:uppercase; letter-spacing:.06em; font-weight:700; }
.required { color:#ba1a1a; margin-left:2px; }
.field-input,.field-select,.field-textarea { width:100%; border:1px solid #9ca3af; border-radius:10px; padding:10px 12px; background:#fbfdff; color:#121c28; font-size:14px; box-sizing:border-box; }
.field-input:focus,.field-select:focus,.field-textarea:focus { outline:none; border-color:#1261a3; box-shadow:0 0 0 3px rgba(18,97,163,.12); }
.date-select:focus,.date-select:active { background:#eef4ff; }
.field-textarea { min-height:100px; resize:vertical; }
.field-error { border-color:#ba1a1a !important; background:#fff5f5 !important; }
.error-text { color:#ba1a1a; font-size:11px; font-weight:700; margin-top:4px; }
.error-banner { background:#fff5f5; border:1px solid #ffcdd2; border-radius:12px; padding:12px 14px; margin-bottom:14px; display:flex; align-items:center; gap:8px; color:#ba1a1a; font-weight:700; font-size:13px; }

/* ── Tooltips ── */
.tip-wrap { position:relative; display:inline-flex; align-items:center; gap:4px; }
.tip-icon { cursor:help; color:#1261a3; font-size:14px; }
.tip-box { display:none; position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); width:280px; background:#142c51; color:white; padding:10px 12px; border-radius:8px; font-size:12px; line-height:1.5; z-index:30; box-shadow:0 10px 24px rgba(0,0,0,.16); }
.tip-box:after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:6px solid transparent; border-top-color:#142c51; }
.tip-wrap:hover .tip-box,.tip-wrap:focus-within .tip-box { display:block; }

/* ── Chips ── */
.chip-list { display:flex; flex-wrap:wrap; gap:10px; }
.checkbox-chip { display:flex; align-items:flex-start; gap:8px; border:1px solid #9ca3af; border-radius:10px; padding:10px 12px; background:#fbfdff; min-width:160px; cursor:pointer; transition:all .2s; }
.checkbox-chip:hover { border-color:#1261a3; background:#f0f4ff; }
.checkbox-chip input { margin-top:2px; accent-color:#1261a3; cursor:pointer; }

/* ── Row cards / inline sub-cards ── */
.row-card { border:1px solid #9ca3af; border-radius:12px; padding:14px; background:#fbfdff; position:relative; margin-bottom:12px; }
.remove-btn { position:absolute; top:10px; right:10px; border:none; background:transparent; color:#ba1a1a; cursor:pointer; padding:4px; transition:all .2s; display:flex; align-items:center; }
.remove-btn:hover { color:#002046; transform:scale(1.1); }
.remove-btn .material-symbols-outlined { font-size:20px; }
.add-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; margin-top:8px; border:1px dashed #1261a3; border-radius:999px; color:#1261a3; background:transparent; cursor:pointer; font-weight:700; font-size:13px; transition:all .2s; }
.add-btn:hover { background:#f0f4ff; border-color:#002046; }
.add-btn .material-symbols-outlined { font-size:18px; }

/* ── Annex E specific ── */
.annex-e-wrapper { background:#f3f7fe; border:2px solid #7c8db5; border-radius:18px; padding:20px; margin-bottom:32px; }
.e-entry-card { border:1px solid #7c8db5; border-radius:14px; padding:18px; background:#ffffff; position:relative; margin-bottom:14px; box-shadow:0 2px 6px rgba(0,0,0,.04); }
.e-remove-btn { position:absolute; top:10px; right:10px; border:none; background:#fee2e2; color:#991b1b; cursor:pointer; padding:4px 8px; border-radius:6px; font-size:14px; transition:all .2s; }
.e-remove-btn:hover { background:#fecaca; transform:scale(1.05); }
.e-add-btn { display:inline-flex; align-items:center; gap:6px; padding:10px 20px; margin-top:10px; border:2px dashed #5a6d99; border-radius:999px; color:#5a6d99; background:transparent; cursor:pointer; font-weight:700; font-size:14px; transition:all .2s; }
.e-add-btn:hover { background:#e8edf8; border-color:#3b4d7a; color:#3b4d7a; }
.annex-e-summary-wrapper { background:#f3f7fe; border:2px solid #7c8db5; border-radius:18px; padding:20px; margin-bottom:32px; }
.annex-e-defs-wrapper { background:#f3f7fe; border:2px solid #7c8db5; border-radius:18px; padding:20px; margin-bottom:32px; }

/* ── Category pills ── */
.category-pills { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.category-btn { display:flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid #9ca3af; border-radius:999px; background:#ffffff; color:#44474e; cursor:pointer; font-weight:700; transition:all .2s; font-size:13px; }
.category-btn:hover { border-color:#1261a3; }
.category-btn.active { background:#1261a3; color:#ffffff; border-color:#1261a3; }

/* ── Counters (redesigned) ── */
.counter-row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:4px; }
.counter-pill {
  border:1px solid #9ca3af;
  border-radius:14px;
  padding:16px 12px;
  background:#ffffff;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.counter-pill::before {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:3px;
  background:linear-gradient(90deg, #1261a3, #aec7f7);
  border-radius:14px 14px 0 0;
}
.counter-pill.resolved::before { background:linear-gradient(90deg,#16a34a,#86efac); }
.counter-pill.ongoing::before { background:linear-gradient(90deg,#d97706,#fcd34d); }
.counter-pill.external::before { background:linear-gradient(90deg,#1261a3,#93c5fd); }
.counter-pill.ngo::before { background:linear-gradient(90deg,#7c3aed,#c4b5fd); }
.counter-icon { font-size:20px; color:#74777f; margin-bottom:4px; }
.counter-icon .material-symbols-outlined { font-size:22px; }
.counter-num { font-size:30px; font-weight:800; color:#002046; line-height:1; }
.counter-label { font-size:11px; color:#44474e; text-transform:uppercase; letter-spacing:.06em; margin-top:6px; font-weight:700; }

/* ── Signature cards ── */
.sig-header { font-size:11px; font-weight:800; color:#1261a3; text-transform:uppercase; letter-spacing:.08em; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.sig-header .material-symbols-outlined { font-size:16px; }

/* ── Sticky footer (redesigned) ── */
.sticky-footer {
  position:sticky; bottom:0; z-index:20;
  background:rgba(255,255,255,.98);
  backdrop-filter:blur(12px);
  border-top:1px solid #9ca3af;
  padding:12px 20px;
  margin-left:-18px; margin-right:-18px; margin-bottom:-120px;
  display:flex; justify-content:flex-end; align-items:center; gap:10px;
}
.primary-btn { background:#002046; color:#ffffff; border:none; }
.secondary-btn { background:#ffffff; color:#1261a3; border:1.5px solid #1261a3; }
.primary-btn,.secondary-btn { border-radius:10px; padding:10px 18px; font-weight:700; cursor:pointer; transition:all .2s; display:inline-flex; align-items:center; gap:6px; font-size:14px; }
.primary-btn:hover { background:#1261a3; }
.secondary-btn:hover { background:#f0f4ff; }
.primary-btn .material-symbols-outlined, .secondary-btn .material-symbols-outlined { font-size:18px; }

/* ── Success ── */
.success-card { background:linear-gradient(135deg,#f1fbf4 0%,#ffffff 100%); border:1px solid #4caf50; border-radius:16px; padding:18px; margin-top:16px; }
.success-text { color:#1a6e3c; font-weight:700; }

/* ── Misc ── */
.hint-note { font-size:12px; color:#44474e; margin-top:4px; }
.compact { font-size:12px; color:#44474e; }
.radio-group { display:flex; gap:12px; flex-wrap:wrap; }
.radio-option { display:flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid #9ca3af; border-radius:10px; background:#fbfdff; cursor:pointer; transition:all .2s; }
.radio-option:hover { border-color:#1261a3; }
.radio-option input[type="radio"] { cursor:pointer; accent-color:#1261a3; }

/* ── Animations ── */
@keyframes slideInUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.slide-in { animation:slideInUp .5s ease-out forwards; opacity:0; }

@keyframes successFlash {
  0% { box-shadow: 0 0 0 0 rgba(22,163,74,.5); }
  50% { box-shadow: 0 0 0 20px rgba(22,163,74,.2); }
  100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); }
}
@keyframes checkBounce {
  0% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); opacity: 1; }
}
.success-flash { animation: successFlash .8s ease-out; border-color: #16a34a !important; background: #f0fdf4 !important; }
.success-badge { display: inline-flex; align-items: center; gap: 6px; padding: 8px 20px; border-radius: 999px; background: #16a34a; color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .04em; }
.success-badge .check-icon { animation: checkBounce .4s ease-out; }

/* ── Responsive ── */
@media (max-width:900px) { .panel-grid, .counter-row { grid-template-columns:1fr; } }
.signout-btn { transition: all 0.3s ease; }
.signout-btn:hover {
  background-color: #ba1a1a !important;
  color: #ffffff !important;
  box-shadow: 0 0 16px rgba(186, 26, 26, 0.8), 0 0 4px rgba(255, 255, 255, 0.6) !important;
  border-color: #ba1a1a !important;
}
</style>

<script type="text/babel">
      const { useMemo, useState, useRef, useEffect } = React;


const ModuleAReportingPanel = () => {
  const [formState, setFormState] = useState('editing');
  const [activeCategory, setActiveCategory] = useState('A-1');
  
  const savedMeta = typeof localStorage !== 'undefined' ? JSON.parse(localStorage.getItem('lrp_school_meta') || 'null') : null;
  const savedPrepared = typeof localStorage !== 'undefined' ? JSON.parse(localStorage.getItem('lrp_prepared_by') || 'null') : null;
  const savedValidated = typeof localStorage !== 'undefined' ? JSON.parse(localStorage.getItem('lrp_validated_by') || 'null') : null;

  const [schoolMetadata, setSchoolMetadata] = useState(savedMeta || {
    schoolName: '',
    schoolId: '',
    reportingYear: String(new Date().getFullYear()) + '-' + String(new Date().getFullYear() + 1),
    address: '',
    classification: 'Public',
    level: 'Elementary'
  });

  const [categoryData, setCategoryData] = useState({
    'A-1': { incidentDate: '', incidentPlace: '', motives: [], affectedStudents: [{ name: '', age: '', gender: 'M', disability: 'No', impacts: [], enrollmentStatus: '', performanceBefore: '', performanceAfter: '' }], initiatingParty: [{ name: '', age: '', gender: 'M' }], actionsTaken: '', status: '' },
    'A-2': { incidentDate: '', incidentPlace: '', motives: [], affectedStudents: [{ name: '', age: '', gender: 'M', disability: 'No', impacts: [], enrollmentStatus: '', performanceBefore: '', performanceAfter: '' }], initiatingParty: [{ name: '', age: '', gender: 'M' }], actionsTaken: '', status: '' },
    'A-3': { incidentDate: '', incidentPlace: '', motives: [], affectedStudents: [{ name: '', age: '', gender: 'M', disability: 'No', impacts: [], enrollmentStatus: '', performanceBefore: '', performanceAfter: '' }], initiatingParty: [{ name: '', age: '', gender: 'M' }], actionsTaken: '', status: '' },
    'A-4': { incidentDate: '', incidentPlace: '', motives: [], affectedStudents: [{ name: '', age: '', gender: 'M', disability: 'No', impacts: [], enrollmentStatus: '', performanceBefore: '', performanceAfter: '' }], initiatingParty: [{ name: '', age: '', gender: 'M' }], actionsTaken: '', status: '' },
    'A-5': { incidentDate: '', incidentPlace: '', motives: [], affectedStudents: [{ name: '', age: '', gender: 'M', disability: 'No', impacts: [], enrollmentStatus: '', performanceBefore: '', performanceAfter: '' }], initiatingParty: [{ name: '', age: '', gender: 'M' }], actionsTaken: '', status: '' }
  });

  const [preparedBy, setPreparedBy] = useState(savedPrepared || { name: '', designation: '', date: '' });
  const [validatedBy, setValidatedBy] = useState(savedValidated || { name: '', designation: '', date: '' });
  const [validationErrors, setValidationErrors] = useState({});

  useEffect(function() {
    var u = window.__user;
    if (u && u.schoolName) {
      setSchoolMetadata(function(prev) {
        if (prev.schoolName) return prev;
        return Object.assign({}, prev, { schoolName: u.schoolName, schoolId: u.schoolId || '' });
      });
    }
    var iv = setInterval(function() {
      u = window.__user;
      if (u && u.schoolName) {
        clearInterval(iv);
        setSchoolMetadata(function(prev) {
          if (prev.schoolName) return prev;
          return Object.assign({}, prev, { schoolName: u.schoolName, schoolId: u.schoolId || '' });
        });
      }
    }, 200);

    // Load draft if ?draft=REF is in URL
    var params = new URLSearchParams(window.location.search);
    var ref = params.get('draft');
    if (ref && window.__token) {
      fetch('/api/drafts/' + encodeURIComponent(ref), { headers: { 'Authorization': 'Bearer ' + window.__token } })
        .then(function(r) { return r.json(); })
        .then(function(draft) {
          var d = draft.report_data || {};
          setDraftRef(draft.reference_number);
          if (d.schoolMetadata) setSchoolMetadata(d.schoolMetadata);
          if (d.categoryData) setCategoryData(d.categoryData);
          if (d.preparedBy) setPreparedBy(d.preparedBy);
          if (d.validatedBy) setValidatedBy(d.validatedBy);
          if (d.activeModule) setActiveModule(d.activeModule);
          if (d.moduleBData) setModuleBData(d.moduleBData);
          if (d.moduleCData) setModuleCData(d.moduleCData);
          if (d.periodCovered) setPeriodCovered(d.periodCovered);
          if (d.totalStudents) setTotalStudents(d.totalStudents);
          if (d.cNarrative) setCNarrative(d.cNarrative);
          if (d.moduleDData) setModuleDData(d.moduleDData);
          if (d.moduleEData) setModuleEData(d.moduleEData);
        })
        .catch(function(e) { console.error('Failed to load draft:', e); });
    }

    return function() { clearInterval(iv); };
  }, []);

  // Check if a Module A category object has any meaningful data filled in
  function isCategoryEmpty(cat) {
    if (!cat) return true;
    if (cat.incidentDate || cat.incidentPlace || cat.actionsTaken || cat.status) return false;
    if (cat.motives && cat.motives.length > 0) return false;
    var hasStudent = cat.affectedStudents && cat.affectedStudents.some(function(s) { return s.name || s.age; });
    var hasParty = cat.initiatingParty && cat.initiatingParty.some(function(p) { return p.name || p.age; });
    if (hasStudent || hasParty) return false;
    return true;
  }

  // Module C is never empty — it's a flat structure
  function isModuleCEmpty(data) {
    if (!data) return true;
    return !data.children || data.children.length === 0 || data.children.every(function(c) { return !c.name.trim(); });
  }

  // Filter out empty categories from an object like { 'A-1': {...}, 'A-2': {...} }
  function filterEmptyCategories(cats) {
    var result = {};
    Object.keys(cats).forEach(function(k) {
      if (!isCategoryEmpty(cats[k])) result[k] = cats[k];
    });
    return result;
  }

  function categoryTitle(key, mod) {

  function flattenDetail(obj, mod, sectionKey) {
    var result = [];

      if (v === null || v === undefined) { result.push({ label: label, value: '—' }); }

        if (v.length === 0) { result.push({ label: label, value: 'None' }); }

        <button className="secondary-btn" type="button" onClick={handleSaveDraft}>
          <span className="material-symbols-outlined">save</span> Save Draft
        </button>
        <button className="primary-btn" type="button" onClick={handleSubmit}>
          <span className="material-symbols-outlined">send</span> Submit Report
        </button>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<ModuleAReportingPanel />);
</script>
