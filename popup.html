<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FreeChess Coach</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 270px;
      margin: 0;
      padding: 16px;
      background: #111827;
      color: #f3f4f6;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    p {
      font-size: 12px;
      color: #9ca3af;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }
    .legend {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
    }
    .dot-red {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
      margin-right: 8px;
    }
    .dot-blue {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
      margin-right: 8px;
    }
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      padding-top: 8px;
      border-top: 1px solid #374151;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <h3>
    <img src="icon48.png" style="width: 22px; height: 22px; border-radius: 5px;" alt="Logo">
    <span>FreeChess Coach</span>
    <span class="status-badge" style="margin-left: auto;"></span>
  </h3>
  <p>Universal real-time chess engine monitor with autonomous board detection.</p>
  
  <div class="legend">
    <div class="legend-item">
      <div class="dot-red"></div>
      <span><strong style="color:#f87171">Red Glow / Shake:</strong> Blunder / Mistake</span>
    </div>
    <div class="legend-item">
      <div class="dot-blue"></div>
      <span><strong style="color:#38bdf8">Blue Glow / Shake:</strong> Brilliant / Great</span>
    </div>
  </div>

  <div class="footer-row">
    <span>Autonomous Detection</span>
    <strong style="color: #34d399;">Active (Universal)</strong>
  </div>
</body>
</html>
